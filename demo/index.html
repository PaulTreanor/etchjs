<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>etch.js: proof of concept</title>
<style>
	html, body {
		margin: 0;
		font-family: system-ui, sans-serif;
		color: #000;
		padding: 2rem;
	}
	h1 { font-size: 1.2rem; font-weight: 600; }
	h2 { font-size: 1.1rem; font-weight: 600; }
	p { color: #000; font-size: 0.85rem; max-width: 60ch; }
	button { padding: 20px; background-color: beige; font-size: 1.2rem; font-weight:600}

	.row {
		display: flex;
		gap: 1.5rem;
		flex-wrap: wrap;
		margin-bottom: 2rem;
	}

	.stipple {
		resize: both;
		overflow: auto;
		border: 1px dashed #444;
	}

	.box { width: 220px; height: 160px; }

</style>
</head>
<body>
	<h1>etch.js demo page</h1>

	<h2>Resize test</h2>
	<p>
		Pattern should stay consistent with no seams as box grows (grab button right corner of boxes)
	</p>

	<div class="row">
		<div class="stipple box" data-fill="stipple" data-fill-density="15" data-fill-color="#ff4d4d"></div>
	</div>

	<button data-fill="stipple" data-fill-density="100" data-fill-color="#4dd0ff">hello</button>

	<h1>dynamically added (MutationObserver check)</h1>
	<p>This box is inserted 1s after load with plain JS. It should still pick up the fill.</p>
	<div id="dynamic-target"></div>

	

	<script type="module" src="../src/vanilla/etch.js"></script>
	<script type="module">
		setTimeout(() => {
			const el = document.createElement("div");
			el.className = "stipple box";
			el.dataset.fill = "stipple";
			el.dataset.fillDensity = "60";
			el.dataset.fillColor = "#7fff8f";
			document.querySelector("#dynamic-target").appendChild(el);
		}, 1000);
	</script>
</body>
</html>
